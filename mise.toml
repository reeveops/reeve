[settings]
experimental = true

[tools]
go = "latest"
goreleaser = "latest"
# Pinned >= 2.12: older binaries (e.g. a runner-preinstalled 2.5.0) fail to
# load .golangci.yml against this repo's `go 1.26.5` directive.
golangci-lint = "2.12.2"
hk = "latest"
pkl = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
"go:github.com/securego/gosec/v2/cmd/gosec" = "latest"
"npm:@fission-ai/openspec" = "latest"

[env]
HK_MISE = "1"
# Explicit: hk hooks don't always inherit the system C compiler path,
# so `go test -race` needs CGO_ENABLED=1 here.
# Release binaries override to 0 via .goreleaser.yaml.
CGO_ENABLED = "1"

[hooks]
postinstall = """
  # Install git hooks (pre-commit, pre-push, check) defined in hk.pkl.
  hk install --mise || true

  # Initialize or update the OpenSpec scaffold.
  if [ ! -d openspec ]; then
    openspec init --tools claude
  else
    openspec update
  fi

  # Pre-stage so `mise install` leaves a build-ready tree.
  go mod download || true
"""

# ── build ──────────────────────────────────────────────────────────────

[tasks.build]
run = "go build -o bin/reeve ./cmd/reeve"
description = "Build reeve binary to bin/reeve"

[tasks.build-release]
run = "go build -trimpath -ldflags='-s -w -X main.version=$(git describe --tags --always --dirty)' -o bin/reeve ./cmd/reeve"
description = "Build optimized release binary (trimpath + stripped)"

# ── run ────────────────────────────────────────────────────────────────

[tasks.run]
run = "go run ./cmd/reeve"
description = "Build and run reeve (pass args via: mise run run -- lint)"

[tasks.demo]
run = "cd examples/toy-stack && go run ../../cmd/reeve plan-run --sha demo --run-number 1"
description = "Run plan-run against the toy-stack example"

# ── test / lint ────────────────────────────────────────────────────────

[tasks.test]
run = "go test -race ./..."
description = "Run all tests with the race detector"

[tasks."test:golden"]
run = "go test ./internal/core/render/ -update"
description = "Regenerate golden files (internal/core/render/testdata)"

[tasks.fmt]
run = "go fmt ./..."
description = "Format Go source"

[tasks.vet]
run = "go vet ./..."
description = "Run go vet"

[tasks.lint]
run = "golangci-lint run"
description = "Run golangci-lint (enforces internal/core/* purity via depguard)"

[tasks.vuln]
run = "govulncheck ./..."
description = "Go vulnerability scanner (Go standard library + dependencies)"

[tasks.sec]
# Canonical gosec invocation - CI (ci.yml `sec`, security.yml `vuln-scan`)
# calls this task so the rule set is defined once.
#
# Only two rules are excluded, and both are justified:
#   G104 "Audit errors not checked" - golangci-lint runs errcheck with a
#        curated exclude list; this is a strictly noisier duplicate.
#   G115 "Type conversion which leads to integer overflow" - reeve parses no
#        binary formats and has one narrowing conversion in the tree
#        (awsoidc int32(duration.Seconds()), where an overflow yields a
#        negative DurationSeconds that STS rejects).
#
# The taint rules (G7xx) and the exec/file rules (G204, G304) are ON. They
# fire on code that is correct by design - reeve's whole job is shelling out
# to an IaC CLI and POSTing to operator-configured endpoints - so those sites
# carry `#nosec <rule> -- <reason>`. The point is not the existing findings,
# it is that a NEW exec site, config-derived path, or outbound sink cannot be
# added without someone writing down why it is safe.
run = "gosec -quiet -fmt=text -exclude=G104,G115 -exclude-dir=openspec -exclude-dir=docs -exclude-dir=examples ./..."
description = "Static security analyzer for Go (gosec)"

[tasks.check]
depends = ["fmt", "vet", "lint", "vuln", "sec", "test"]
description = "Format, vet, lint, vuln-scan, sec-scan, and test - run before pushing"

[tasks.hooks]
run = "hk run check"
description = "Run the hk `check` hook (fmt + lint + vuln + sec + test)"

# ── release ────────────────────────────────────────────────────────────

[tasks.release-snapshot]
run = "goreleaser release --snapshot --clean"
description = "Local snapshot build via goreleaser (no upload)"

[tasks.release-check]
run = "goreleaser check"
description = "Validate the goreleaser config"

# ── maintenance ────────────────────────────────────────────────────────

[tasks.tidy]
run = "go mod tidy"
description = "Tidy go.mod / go.sum"

[tasks.update]
run = """
mise upgrade go
go get go@latest
go get toolchain@latest
go get -u ./...
go mod tidy
govulncheck ./...
"""
description = "Bump Go toolchain + all deps to latest, tidy, and re-scan for vulns"

[tasks.clean]
run = "rm -rf bin/ dist/"
description = "Remove build artifacts"

# ── fynxlabs standard verb set ────────────────────────────────────────

[tasks.format]
depends = ["fmt"]
description = "Format Go source (alias for `fmt`)"

[tasks.start]
description = "Build and run reeve (alias for `run`)"
depends = ["run"]

[tasks.security]
description = "Run both Go security scanners (govulncheck + gosec)"
depends = ["vuln", "sec"]

[tasks.install]
description = "Install reeve to ~/.local/bin (linux/macos); errors on windows"
depends = ["build"]
run = """
case "$(uname -s)" in
  Linux|Darwin)
    mkdir -p "$HOME/.local/bin"
    install -m755 bin/reeve "$HOME/.local/bin/reeve"
    echo "installed: $HOME/.local/bin/reeve"
    ;;
  *)
    echo "install: not implemented for $(uname -s)" >&2
    exit 1
    ;;
esac
"""

[tasks.ci]
description = "Run the full CI check locally (fmt + vet + lint + security + test)"
depends = ["fmt", "vet", "lint", "security", "test"]
