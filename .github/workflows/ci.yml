name: CI

on:
  push:
    branches: [master, next]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: golangci-lint
        run: golangci-lint run --timeout=5m

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: govulncheck
        run: govulncheck ./...

  sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: gosec
        # Non-zero exit on findings; text output goes to the job log. The rule
        # set lives in mise.toml's `sec` task so CI and local runs cannot drift.
        run: mise run sec

  govet-extended:
    # Catches issues golangci-lint's vet settings sometimes miss.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: go vet -vettool=$(which shadow 2>/dev/null || true) ./... || go vet ./...
