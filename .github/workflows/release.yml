name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write # sigstore keyless

# One release at a time. Concurrent dispatches would compute the same next
# tag; never cancel a release mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived token from the reeve-tap GitHub App. The app is
      # installed on reeveops/reeve and reeveops/homebrew-tap with write access
      # to code, which is what GoReleaser needs to commit the Homebrew cask.
      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          owner: reeveops
          repositories: homebrew-tap
          # Scope the minted token to the one permission the cask commit
          # needs, instead of inheriting every app permission.
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Tag-push releases use the pushed tag as-is. Dispatch releases compute
      # the next version from the latest stable tag and push the new tag with
      # GITHUB_TOKEN, which never re-triggers this workflow (same-token
      # recursion protection), so the release continues in this same run with
      # HEAD already at the tagged commit - exactly what GoReleaser needs.
      - name: Resolve release tag
        id: tag
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Latest stable tag. The glob alone also matches prereleases
            # (v1.0.0-rc1) and malformed tags (v9junk.0.0), so keep only exact
            # canonical vMAJOR.MINOR.PATCH. Leading-zero components (v08.0.0)
            # are rejected too: bash arithmetic reads them as octal and errors.
            LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -1 || true)
            LATEST="${LATEST:-v0.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            case "$BUMP" in
              major) TAG="v$((MAJOR + 1)).0.0" ;;
              minor) TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
              patch) TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) echo "::error::invalid bump '$BUMP'"; exit 1 ;;
            esac
            echo "Releasing $TAG (bump: $BUMP from $LATEST)"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Release notes baseline: greatest stable tag strictly below TAG.
          # Left to its own detection GoReleaser grabs the nearest tag behind
          # HEAD, which is one of edge-build's per-commit master-<sha>
          # prerelease tags - the notes then cover a single commit.
          #
          # BASE strips any prerelease suffix (v1.0.0-rc1 -> v1.0.0) so an rc
          # baselines against the stable line, not the newest stable overall.
          # BASE is dropped from the candidates and re-inserted, so the entry
          # sorted just before it is the greatest strictly-lower stable tag.
          BASE="${TAG%%-*}"
          PREV=$(git tag --list 'v[0-9]*' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | grep -vFx "$BASE" \
            | { cat; echo "$BASE"; } | sort -V \
            | awk -v t="$BASE" '$0 == t {exit} {p = $0} END {print p}' || true)
          echo "Notes range: ${PREV:-<repo start>} -> $TAG"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          # Pin both ends of the changelog range so edge-build's master-<sha>
          # tags can never be picked as current or previous.
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tag.outputs.prev }}

      # Point the floating major tag (v0, v1, ...) at this release so consumers
      # who pin @master always get the latest v0.x. Skipped for prerelease tags
      # (anything with a hyphen, e.g. v1.0.0-rc1). The v0 tag does not match the
      # v*.*.* trigger above, so this force-push does not re-trigger the workflow.
      - name: Move major version tag
        if: ${{ !contains(steps.tag.outputs.tag, '-') }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          MAJOR="${TAG%%.*}"        # v0.1.0 -> v0
          echo "Pointing $MAJOR at $TAG"
          git tag -f "$MAJOR" "$TAG"
          git push origin "refs/tags/$MAJOR" --force
