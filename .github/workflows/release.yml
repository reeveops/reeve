name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Each job grants only what it needs; a job's permissions block replaces
# this baseline. The tag job never sees signing identity; the release job
# never runs on a branch ref.
permissions:
  contents: read

# One release at a time. Concurrent dispatches would compute the same next
# tag; never cancel a release mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A workflow_dispatch run on a non-tag ref other than master is refused
  # with the ref it saw and the forms it may take. Dispatches on a version
  # tag go straight to the release job with no failed job in the run.
  refuse-bad-dispatch-ref:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/master' &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Refuse dispatch on an unsupported ref
        env:
          SEEN: ${{ github.ref }}
        run: |
          echo "::error::workflow_dispatch releases start on refs/heads/master (the job computes and pushes the next version tag) or on an existing version tag ref (refs/tags/vX.Y.Z), not on ${SEEN}. Push a v*.*.* tag instead."
          exit 1

  # A workflow_dispatch run on master ONLY computes and pushes the next
  # version tag, then starts the build/sign run on the tag ref. It never
  # builds or signs here: the cosign signing identity is the ref the
  # workflow runs on, so a version-tagged artifact must carry the identity
  # of a run on refs/tags/<version> - which a run on master cannot provide.
  # The job runs only for dispatches ON MASTER: the release run this job
  # dispatches is itself a workflow_dispatch (on the tag ref), so a
  # master-only condition is what keeps that run's tag job green (skipped).
  #
  # A tag pushed with GITHUB_TOKEN does not trigger a push run (same-token
  # events are not forwarded), so starting the release run is an explicit
  # workflow_dispatch: one of the two event types GITHUB_TOKEN may trigger.
  tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
      actions: write  # start the release run on the tag ref
    steps:
      # Defense in depth behind the job-level if: a non-master ref that
      # reaches this job is refused before any tag is computed.
      - name: Refuse non-master dispatch
        if: ${{ github.ref != 'refs/heads/master' }}
        env:
          STARTED_FROM: ${{ github.ref }}
        run: |
          echo "::error::workflow_dispatch tag computation requires the master ref; this run started on ${STARTED_FROM}. Push a v*.*.* tag instead."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Latest stable tag. The glob alone also matches prereleases
      # (v1.0.0-rc1) and malformed tags (v9junk.0.0), so keep only exact
      # canonical vMAJOR.MINOR.PATCH. Leading-zero components (v08.0.0)
      # are rejected too: bash arithmetic reads them as octal and errors.
      - name: Compute and push release tag
        id: tag
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -1 || true)
          LATEST="${LATEST:-v0.0.0}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          case "$BUMP" in
            major) TAG="v$((MAJOR + 1)).0.0" ;;
            minor) TAG="v${MAJOR}.$((MINOR + 1)).0" ;;
            patch) TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *) echo "::error::invalid bump '$BUMP'"; exit 1 ;;
          esac
          echo "Releasing $TAG (bump: $BUMP from $LATEST)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Start the release run on the tag ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # workflow_dispatch --ref <tag> works with GITHUB_TOKEN (push events
          # do not), and release.yml exists on the tag by construction: the
          # tag points at the master commit carrying this file.
          gh workflow run release.yml --ref "$TAG" --repo "$REPO"
          echo "Release run dispatched on refs/tags/$TAG"

  # The build/sign job. It runs ONLY on a version tag ref: hand-pushed
  # v*.*.* tag pushes, and the run the tag job dispatches on the tag. The
  # tap token, GHCR write, and id-token signing grants live only here - the
  # tag job above never carries them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: write # publish the GHCR image
      id-token: write # sigstore keyless
    steps:
      # Defense in depth behind the job-level if: the release builds only a
      # FULL version (vX.Y.Z or vX.Y.Z-<prerelease>). Branch refs are kept
      # out by the job condition; a non-version tag ref that is reached here
      # anyway - including the floating v0/v1 major aliases - fails with the
      # ref it saw and the form it requires. Nothing has run yet - no token,
      # no checkout.
      - name: Refuse non-version-tag ref
        env:
          STARTED_FROM: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        # The release builds a FULL version: vX.Y.Z or vX.Y.Z-<prerelease>.
        # Any other ref - branches, and tags like the floating `v0` major
        # alias - is refused with the ref seen and the form required. The
        # run that dispatched this one pushed the version tag itself, so a
        # legitimate release always arrives here as a full version.
        run: |
          set -euo pipefail
          REF_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ "$GITHUB_REF" != "refs/tags/$TAG" ]] || ! [[ "$TAG" =~ $REF_RE ]]; then
            echo "::error::release build/sign requires a full version tag ref (refs/tags/vX.Y.Z or vX.Y.Z-<prerelease>); this run started on ${STARTED_FROM} (tag '${TAG}'). The floating major tags (v0, v1, ...) are pointers, not releases."
            exit 1
          fi

      # Mint a short-lived token from the reeve-tap GitHub App. The app is
      # installed on reeveops/reeve and reeveops/homebrew-tap with write access
      # to code, which is what GoReleaser needs to commit the Homebrew cask.
      - name: Mint tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          owner: reeveops
          repositories: homebrew-tap
          # Scope the minted token to the one permission the cask commit
          # needs, instead of inheriting every app permission.
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The tag is this run's ref (a hand-pushed tag, or the tag the tag job
      # dispatched on). Release notes baseline: greatest stable tag strictly
      # below TAG, recomputed from this checkout's full tag list. Left to its
      # own detection GoReleaser grabs the nearest tag behind HEAD, which is
      # one of edge-build's per-commit master-<sha> prerelease tags - the
      # notes then cover a single commit.
      #
      # BASE strips any prerelease suffix (v1.0.0-rc1 -> v1.0.0) so an rc
      # baselines against the stable line, not the newest stable overall.
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo "::error::release job reached on ${GITHUB_REF}; expected refs/tags/<version>"
            exit 1
          fi
          # BASE strips any prerelease suffix (v1.0.0-rc1 -> v1.0.0) so an rc
          # baselines against the stable line, not the newest stable overall.
          # BASE is dropped from the candidates and re-inserted, so the entry
          # sorted just before it is the greatest strictly-lower stable tag.
          BASE="${TAG%%-*}"
          PREV=$(git tag --list 'v[0-9]*' \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | grep -vFx "$BASE" \
            | { cat; echo "$BASE"; } | sort -V \
            | awk -v t="$BASE" '$0 == t {exit} {p = $0} END {print p}' || true)
          echo "Releasing $TAG; notes range: ${PREV:-<repo start>} -> $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}
          # Pin both ends of the changelog range so edge-build's master-<sha>
          # tags can never be picked as current or previous.
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tag.outputs.prev }}

      # Point the floating major tag (v0, v1, ...) at this release so consumers
      # who pin @master always get the latest v0.x. Skipped for prerelease tags
      # (anything with a hyphen, e.g. v1.0.0-rc1). The v0 tag does not match the
      # v*.*.* trigger above, and a GITHUB_TOKEN push never re-triggers the
      # workflow, so this force-push does not start another release.
      - name: Move major version tag
        if: ${{ !contains(steps.tag.outputs.tag, '-') }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          MAJOR="${TAG%%.*}"        # v0.1.0 -> v0
          echo "Pointing $MAJOR at $TAG"
          git tag -f "$MAJOR" "$TAG"
          git push origin "refs/tags/$MAJOR" --force
