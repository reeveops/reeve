name: security

on:
  pull_request:
  schedule:
  # Weekly re-scan so CVEs that land after a dormant branch is merged
  # still surface.
  - cron: "0 6 * * 1"
  workflow_dispatch:


permissions:
  contents: read

jobs:
  # Dependency review runs on PRs only - blocks PRs that introduce HIGH+
  # CVEs in dependencies before they hit master.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        comment-summary-in-pr: on-failure

  # Scheduled (and manually dispatched) runs re-scan the default branch
  # against the current Go vulnerability database - this is what surfaces
  # CVEs published after the code stopped changing. CI already runs the
  # same scanners per push/PR; this covers the quiet weeks in between.
  vuln-scan:
    name: Scheduled vulnerability scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      with:
        experimental: true

    - name: govulncheck
      run: govulncheck ./...

    - name: gosec
      # Rule set lives in mise.toml's `sec` task - single definition.
      run: mise run sec
