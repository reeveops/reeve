version: 1
config_type: engine
engine:
  type: tofu
  stacks:
    - pattern: "envs/*"
      stacks: [dev, prod]
  policy_hooks:
    - name: prevent-production-deletes
      command: [conftest, test, --policy, policies/prevent_deletes.rego, "{{plan_json}}"]
      on_fail: block
      required: true
    - name: require-instance-tags
      command: [conftest, test, --policy, policies/require_tags.rego, "{{plan_json}}"]
      on_fail: block
      required: true
    - name: large-change
      command: [python3, scripts/change-limit.py, "{{plan_json}}", "20"]
      on_fail: warn
      required: true
    - name: opa-restrict-regions
      command: [conftest, test, --policy, policies/restrict_regions.rego, "{{plan_json}}"]
      on_fail: block
      required: true
    # Integration sketch: read the cost-hook section before adapting this.
    - name: cost-gate
      command: ["./scripts/cost-gate.sh", "{{plan_json}}", "{{env}}"]
      on_fail: warn
      required: false
