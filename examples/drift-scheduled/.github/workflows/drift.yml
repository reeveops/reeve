name: drift
on:
  schedule:
    - cron: "17 */2 * * *"
    - cron: "23 */6 * * *"
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      schedule:
        description: Named schedule from drift.yaml
        default: prod
        type: choice
        options: [critical, prod, slow-movers]
permissions:
  contents: read
  pull-requests: read
  issues: write
  id-token: write
jobs:
  drift:
    uses: reeveops/reeve/.github/workflows/reeve.yml@d31c814640689c2f2e1b0d02d2bc11a80a94faab
    with:
      mode: drift
      # Prepared runner supplies bucket auth and PD_CHANGE_EVENTS_KEY.
      runner: reeve-drift
      pulumi_version: "3.262.0"
      drift_schedule: ${{ inputs.schedule || (github.event.schedule == '17 */2 * * *' && 'critical') || (github.event.schedule == '23 */6 * * *' && 'prod') || 'slow-movers' }}
    secrets:
      slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
