version: 1
config_type: auth

providers:
  gcp-prod:
    type: gcp_wif
    workload_identity_provider: projects/111/locations/global/workloadIdentityPools/github/providers/reeve
    service_account: reeve-prod@mycompany-prod.iam.gserviceaccount.com
    duration: 1h

  gcp-prod-readonly:
    type: gcp_wif
    workload_identity_provider: projects/111/locations/global/workloadIdentityPools/github/providers/reeve
    service_account: reeve-drift-readonly@mycompany-prod.iam.gserviceaccount.com
    duration: 2h

  # Application-default credentials for `reeve plan-run` on a laptop
  # (refuses to run under CI=true).
  gcp-local:
    type: gcloud_adc

bindings:
  - match: { stack: "**" }
    providers: [gcp-prod]
    local: [gcp-local]   # substitutes for gcp-prod in --local runs

  # override: replaces the GCP-scoped provider from the binding above for
  # drift runs; plain providers: would union both and fail lint with a
  # same-scope conflict.
  - match: { stack: "**", mode: drift }
    override: [gcp-prod-readonly]
