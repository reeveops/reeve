name: reeve
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  reeve:
    uses: reeveops/reeve/.github/workflows/reeve.yml@d31c814640689c2f2e1b0d02d2bc11a80a94faab
    with:
      mode: gitops
      # Prepared runner: its IAM identity grants access to the Reeve bucket.
      runner: reeve-aws
      pulumi_version: "3.262.0"
