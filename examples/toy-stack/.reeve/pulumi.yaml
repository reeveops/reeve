version: 1
config_type: engine

engine:
  type: pulumi
  binary:
    path: pulumi

  state:
    backend: file
    url: file:///REPLACE_WITH_ABSOLUTE_PATH/pulumi-state # set by the README setup
    secrets_provider:
      type: passphrase
      passphrase: reeve-demo-only # synthetic local fixture, never a real secret

  stacks:
    - pattern: "projects/*"
      stacks: [dev, prod]

  filters:
    exclude: []

  change_mapping:
    ignore_changes:
      - "**/*.md"
      - "**/README*"
      - "**/node_modules/**"

  execution:
    max_parallel_stacks: 2
    preview_timeout: 5m
