name: reeve
description: PR-native, self-hosted GitOps orchestrator for Pulumi, OpenTofu, and Terraform
author: reeve contributors
branding:
  icon: shield
  color: blue

inputs:
  command:
    description: Reeve subcommand. Omit to auto-detect from the GitHub event.
    required: false
    default: ""
  root:
    description: Path to the consumer repository root containing .reeve.
    required: false
    default: ""
  pulumi-version:
    description: Version of the Pulumi CLI to install. Leave blank to skip.
    required: false
    default: ""
  opentofu-version:
    description: Version of the OpenTofu CLI to install. Leave blank to skip.
    required: false
    default: ""
  terraform-version:
    description: Version of the Terraform CLI to install. Leave blank to skip.
    required: false
    default: ""
  github-token:
    description: GitHub token used for API access.
    required: false
    default: ${{ github.token }}
  slack-token:
    description: Slack bot OAuth token.
    required: false
    default: ""
  gcp-workload-identity-provider:
    description: GCP Workload Identity Provider resource name.
    required: false
    default: ""
  gcp-service-account:
    description: GCP service account email to impersonate.
    required: false
    default: ""
  extra-args:
    description: Additional whitespace-delimited arguments for the Reeve command.
    required: false
    default: ""
  drift-schedule:
    description: Named drift.yaml schedule passed to drift run.
    required: false
    default: ""
  drift-pattern:
    description: Stack pattern passed to drift run.
    required: false
    default: ""
  drift-if-stale:
    description: Skip stacks within the configured freshness window.
    required: false
    default: "false"
  allowed-associations:
    description: Comma-separated author associations allowed to trigger commands.
    required: false
    default: OWNER,MEMBER,COLLABORATOR
  command-prefix:
    description: Comma-separated accepted PR comment prefixes.
    required: false
    default: /reeve
  run-on-approval:
    description: Dispatch approved reviews when true.
    required: false
    default: "false"
  log-level:
    description: Reeve log level.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run pinned Reeve action
      uses: $/.github/actions/reeve
      with:
        command: ${{ inputs.command }}
        root: ${{ inputs.root }}
        pulumi-version: ${{ inputs.pulumi-version }}
        opentofu-version: ${{ inputs.opentofu-version }}
        terraform-version: ${{ inputs.terraform-version }}
        github-token: ${{ inputs.github-token }}
        slack-token: ${{ inputs.slack-token }}
        gcp-workload-identity-provider: ${{ inputs.gcp-workload-identity-provider }}
        gcp-service-account: ${{ inputs.gcp-service-account }}
        extra-args: ${{ inputs.extra-args }}
        drift-schedule: ${{ inputs.drift-schedule }}
        drift-pattern: ${{ inputs.drift-pattern }}
        drift-if-stale: ${{ inputs.drift-if-stale }}
        allowed-associations: ${{ inputs.allowed-associations }}
        command-prefix: ${{ inputs.command-prefix }}
        run-on-approval: ${{ inputs.run-on-approval }}
        log-level: ${{ inputs.log-level }}
